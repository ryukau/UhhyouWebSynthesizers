<!doctype html>
<html>

<head>
  <meta charset="utf-8">
  <title>PocketFFT Verification Tests</title>
</head>

<body>
  <h1>PocketFFT Tests</h1>
  <p>Check the browser console (F12) for test assertion results.</p>

  <script type="module">
    import PocketFFT from "./pocketfft.js";
    import { newPocketFFTHelper } from "./pocketffthelper.js";

    async function main() {
      // Load static test vectors generated by native C++
      const resp = await fetch("./pocketfft.json");
      const data = await resp.json();
      const tolerance = 1e-12; // Adjust from 0 to account for potential minor floating-point variations

      console.log("Starting legacy Embind vector tests...");
      const fft = await PocketFFT();

      // 1. Test original legacy r2c and c2r bindings
      let vec = new fft.vector_f64();
      vec.resize(data.input.length, 0);
      for (let i = 0; i < data.input.length; ++i) {
        vec.set(i, data.input[i]);
      }

      let spectrum = fft.r2c(vec);
      vec.delete();

      for (let i = 0; i < data.spectrum.length; ++i) {
        const dr = Math.abs(data.spectrum[i][0] - spectrum.get(i).real);
        const di = Math.abs(data.spectrum[i][1] - spectrum.get(i).imag);
        console.assert(dr <= tolerance, `Legacy r2c error at index ${i}, real: expected ${data.spectrum[i][0]}, got ${spectrum.get(i).real}`, new Error());
        console.assert(di <= tolerance, `Legacy r2c error at index ${i}, imag: expected ${data.spectrum[i][1]}, got ${spectrum.get(i).imag}`, new Error());
      }

      let output = fft.c2r(spectrum);
      spectrum.delete();

      for (let i = 0; i < data.output.length; ++i) {
        const diff = Math.abs(data.output[i] - output.get(i));
        console.assert(diff <= tolerance, `Legacy c2r error at index ${i}: expected ${data.output[i]}, got ${output.get(i)}`, new Error());
      }
      output.delete();

      // Test original complex vector access bindings
      let cv = new fft.vector_complex128();
      cv.resize(1);
      console.assert(cv.getReal(0) === 0, "cv.getReal(0) should be 0", new Error());
      console.assert(cv.getImag(0) === 0, "cv.getImag(0) should be 0", new Error());

      cv.setReal(0, 10);
      console.assert(cv.getReal(0) === 10, "cv.getReal(0) should be 10", new Error());

      cv.setImag(0, 22);
      console.assert(cv.getImag(0) === 22, "cv.getImag(0) should be 22", new Error());

      cv.setValue(0, 3.3, 4.4);
      console.assert(cv.getReal(0) === 3.3, "cv.getReal(0) should be 3.3", new Error());
      console.assert(cv.getImag(0) === 4.4, "cv.getImag(0) should be 4.4", new Error());
      cv.delete();

      console.log("Legacy Embind tests passed.");

      // 2. Test the new pocketffthelper.js Wrapper
      console.log("Starting pocketffthelper.js tests...");
      const helper = await newPocketFFTHelper();

      // Standard array-to-array helper r2c
      const helperSpectrum = helper.r2c(data.input);
      console.assert(helperSpectrum.length === data.spectrum.length, "Helper spectrum length mismatch", new Error());
      for (let i = 0; i < data.spectrum.length; ++i) {
        const dr = Math.abs(data.spectrum[i][0] - helperSpectrum[i].re);
        const di = Math.abs(data.spectrum[i][1] - helperSpectrum[i].im);
        console.assert(dr <= tolerance, `Helper r2c error at index ${i}, real`, new Error());
        console.assert(di <= tolerance, `Helper r2c error at index ${i}, imag`, new Error());
      }

      // Standard array-to-array helper c2r
      const helperOutput = helper.c2r(helperSpectrum);
      console.assert(helperOutput.length === data.output.length, "Helper output length mismatch", new Error());
      for (let i = 0; i < data.output.length; ++i) {
        const diff = Math.abs(data.output[i] - helperOutput[i]);
        console.assert(diff <= tolerance, `Helper c2r error at index ${i}`, new Error());
      }

      // 3. Test High-Performance Zero-Copy Direct APIs
      console.log("Starting zero-copy direct TypedArray tests...");
      const signalDirect = new Float64Array(data.input);

      // Directly output interleaved float array [re0, im0, re1, im1, ...]
      const flatSpectrum = helper.r2cDirect(signalDirect);
      console.assert(flatSpectrum instanceof Float64Array, "r2cDirect must return a Float64Array", new Error());
      console.assert(flatSpectrum.length === data.spectrum.length * 2, "Direct spectrum length mismatch", new Error());

      for (let i = 0; i < data.spectrum.length; ++i) {
        const dr = Math.abs(data.spectrum[i][0] - flatSpectrum[2 * i]);
        const di = Math.abs(data.spectrum[i][1] - flatSpectrum[2 * i + 1]);
        console.assert(dr <= tolerance, `Direct r2cDirect error at index ${i}, real`, new Error());
        console.assert(di <= tolerance, `Direct r2cDirect error at index ${i}, imag`, new Error());
      }

      // Directly reconstruct signal from flat interleaved spectrum
      const outputDirect = helper.c2rDirect(flatSpectrum);
      console.assert(outputDirect instanceof Float64Array, "c2rDirect must return a Float64Array", new Error());
      console.assert(outputDirect.length === data.output.length, "Direct output length mismatch", new Error());

      for (let i = 0; i < data.output.length; ++i) {
        const diff = Math.abs(data.output[i] - outputDirect[i]);
        console.assert(diff <= tolerance, `Direct c2rDirect error at index ${i}`, new Error());
      }

      console.log("All validation tests completed.");
    }

    main().catch(err => {
      console.error("Test execution failed:", err);
    });
  </script>
</body>

</html>
